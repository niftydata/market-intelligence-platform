services:
  - type: web
    name: market-intelligence-dashboard
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install .
    startCommand: >-
      streamlit run app/streamlit_app.py
      --server.address 0.0.0.0
      --server.port $PORT
      --server.headless true
    healthCheckPath: /_stcore/health
    autoDeployTrigger: commit
    domains:
      - market-intelligence.niftydata.com.au
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: DATABASE_URL
        sync: false
      - key: STREAMLIT_BROWSER_GATHER_USAGE_STATS
        value: "false"
      - key: ENABLE_AI_ASSISTANT
        value: "true"
      - key: AI_DEMO_USERNAME
        value: macquarie
      - key: AI_DEMO_PASSWORD_HASH
        sync: false
      - key: AI_MAX_LOGIN_ATTEMPTS
        value: "5"
      - key: AI_MAX_QUESTIONS_PER_SESSION
        value: "20"
      - key: FOUNDRY_PROJECT_ENDPOINT
        value: https://trs-aus1-fy-02.services.ai.azure.com/api/projects/proj-default
      - key: FOUNDRY_MODEL
        value: gpt-5.4-mini
      - key: AZURE_TENANT_ID
        value: c0d27802-b957-4931-a27b-b20fac443b90
      - key: AZURE_CLIENT_ID
        value: 48a1cae9-a981-4dfe-a032-d9950726cab4
      - key: AZURE_CLIENT_SECRET
        sync: false
